<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ES08 — Eventi JavaScript</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fcfbf7; /* Sfondo leggermente più caldo */
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 4px; /* Forme più geometriche e squadrate */
      box-shadow: 0 4px 24px rgba(180, 83, 9, 0.08); /* Ombra calda e leggera */
      padding: 36px 40px;
      width: 100%;
      max-width: 480px;
      border: 1px solid #f3f4f6;
    }

    h1 { font-size: 22px; color: #292524; margin-bottom: 8px; }
    .sub { font-size: 13px; color: #78716c; margin-bottom: 28px; }

    .campo { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e7e5e4;
      border-radius: 4px; /* Angoli squadrati */
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      background: #fff;
    }

    /* ES3 — focus gestito via CSS (Tonalità Arancione/Terracotta) */
    input.focus { background: #fffbeb; border-color: #d97706; }

    /* ES6 — Nuovi colori pastello per lo sfondo password */
    input#pw.debole { background: #fff5f5; border-color: #f87171; }
    input#pw.media  { background: #fffbeb; border-color: #fbbf24; }
    input#pw.forte  { background: #f0fdf4; border-color: #4ade80; }

    .forza { font-size: 11px; margin-top: 5px; font-weight: 600; }
    .forza.debole { color: #ef4444; }
    .forza.media  { color: #d97706; }
    .forza.forte  { color: #16a34a; }

    /* ES5 — errore ripeti password */
    .errore { font-size: 12px; color: #ef4444; margin-top: 5px; display: none; }
    .errore.visibile { display: block; }

    /* ES4 — testo nascondibile in tinta calda */
    .info {
      font-size: 13px;
      color: #92400e;
      background: #fef3c7;
      border-left: 3px solid #d97706;
      padding: 10px 14px;
      border-radius: 0 4px 4px 0;
      margin-bottom: 24px;
      cursor: pointer;
    }
    .nota { font-size: 11px; color: #a8a29e; margin-bottom: 16px; }

    /* ES1 — pulsanti */
    .pulsanti { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }

    button {
      padding: 10px 22px;
      border: none;
      border-radius: 4px; /* Uniformati alle forme della card */
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.1s;
    }
