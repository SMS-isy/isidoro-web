    .errore { font-size: 12px; color: #e11d48; margin-top: 6px; display: none; padding-left: 8px; }

      margin-bottom: 24px;

      font-weight: 500;

    .nota { font-size: 11px; color: #94a3b8; margin-bottom: 16px; font-style: italic; }
