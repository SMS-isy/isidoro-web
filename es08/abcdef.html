<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ES08 — Eventi JavaScript</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      /* Sfondo con gradiente profondo stile tech/synthwave */
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* Card stile Glassmorphism (effetto vetro satinato) */
    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      padding: 40px;
      width: 100%;
      max-width: 480px;
    }

    h1 { font-size: 24px; color: #ffffff; margin-bottom: 8px; font-weight: 700; }
    .sub { font-size: 13px; color: #94a3b8; margin-bottom: 28px; }

    .campo { margin-bottom: 22px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
      background: rgba(15, 23, 42, 0.6);
      color: #ffffff;
    }
    
    input::placeholder { color: #64748b; }

    /* ES3 — Focus con bagliore Neon Viola/Magenta */
    input.focus { 
      background: rgba(15, 23, 42, 0.8); 
      border-color: #d946ef; 
      box-shadow: 0 0 15px rgba(217, 70, 239, 0.4); 
    }

    /* ES6 — Cambi colore password con effetto bordi Neon sfumati */
    input#pw.debole { border-color: #ef4444; box-shadow: 0 0 12px rgba(239, 68, 68, 0.3); }
    input#pw.media  { border-color: #f59e0b; box-shadow: 0 0 12px rgba(245, 158, 11, 0.3); }
    input#pw.forte  { border-color: #10b981; box-shadow: 0 0 12px rgba(16, 185, 129, 0.3); }

    .forza { font-size: 11px; margin-top: 6px; font-weight: 700; letter-spacing: 0.5px; }
    .forza.debole { color: #ef4444; }
    .forza.media  { color: #f59e0b; }
    .forza.forte  { color: #10b981; }

    /* ES5 — errore ripeti password */
    .errore { font-size: 12px; color: #ef4444; margin-top: 6px; display: none; }
    .errore.visibile { display: block; }

    /* ES4 — testo nascondibile stile notifica scura */
    .info {
      font-size: 13px;
      color: #f1f5f9;
      background: rgba(217, 70, 239, 0.15);
      border-left: 4px solid #d946ef;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 24px;
      cursor: pointer;
    }
    .nota { font-size: 11px; color: #64748b; margin-bottom: 16px; }
